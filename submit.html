<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patch Builder - FAForever</title>
    
    <!-- Load ONLY the dedicated builder styles to prevent critical.css from hiding the page -->
    <link rel="stylesheet" href="style/builder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="builder-body">
    <main class="BuilderWrapper">
        <div class="FormContainer">
            <div class="FormHeader">
                <h2><i class="fas fa-hammer"></i> Patch Note Builder</h2>
                <p>Build your patch notes cleanly. Once generated, this will safely bounce you to GitHub to finalize the submission and trigger the site rebuild.</p>
            </div>

            <form id="patchForm">
                <div class="Grid2Col">
                    <div class="FormGroup">
                        <label for="patchVersion"><i class="fas fa-tag"></i> Patch Version</label>
                        <input type="text" id="patchVersion" placeholder="e.g., 3835" required>
                    </div>

                    <div class="FormGroup">
                        <label for="patchDate"><i class="fas fa-calendar-alt"></i> Patch Date</label>
                        <input type="date" id="patchDate" required>
                    </div>
                </div>

                <div class="FormGroup">
                    <label for="patchSummary"><i class="fas fa-align-left"></i> Patch Summary</label>
                    <textarea id="patchSummary" placeholder="Briefly describe the overall goals of this patch..." required></textarea>
                </div>

                <div class="DynamicSection">
                    <label style="color: #38bdf8; font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; display: block;">
                        <i class="fas fa-robot"></i> Unit Changes
                    </label>
                    
                    <div id="unitsContainer">
                        <!-- Unit Cards will be injected here -->
                    </div>

                    <button type="button" class="ActionBtn" id="addUnitBtn">
                        <i class="fas fa-plus"></i> Add Unit
                    </button>
                </div>

                <div class="FormGroup GeneratedYamlContainer">
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
                        <div>
                            <label><i class="fas fa-code"></i> Generated YAML (Preview)</label>
                            <p class="YamlHelper">This code is generated automatically from your form inputs above.</p>
                        </div>
                        <button type="button" id="copyYamlBtn" class="CopyBtn">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                    <textarea id="yamlData" class="CodeEditor" readonly></textarea>
                </div>

                <button type="submit" class="SubmitBtn" id="submitBtn">
                    <i class="fab fa-github"></i> Generate & Open in GitHub
                </button>
            </form>
        </div>
    </main>

    <script>
        // Data Dictionary for Dropdowns (Includes your newly added stats!)
        const CATEGORIES = {
            "Defence": ["Health/MaxHealth", "ShieldRegenAssistMult", "ShieldEnergyDrainRechargeTime", "ShieldMaxHealth", "ShieldRechargeTime", "ShieldRegenRate", "ShieldRegenStartTime", "ShieldSize", "ShieldSpillOverDamageMod", "RegenRate", "PowerDrain"],
            "Display": ["UniformScale"],
            "Economy": ["BuildCostEnergy", "BuildCostMass", "BuildTime", "MaintenanceConsumptionPerSecondEnergy", "BuildRate", "MaxBuildDistance", "ProductionPerSecondEnergy", "ProductionPerSecondMass", "StorageEnergy", "StorageMass"],
            "General": ["TeleportDelay", "TeleportFlatEnergyCost"],
            "Intel": ["FreeIntel", "OmniRadius", "VisionRadius", "WaterVisionRadius", "SonarRadius"],
            "Physics": ["TransportClass", "BackUpDistance", "DragCoefficient", "MaxAcceleration", "MaxBrake", "MaxSpeed", "MaxSpeedReverse", "MaxSteerForce", "RotateOnSpot", "RotateOnSpotThreshold", "TurnRadius", "TurnRate"],
            "UnitScale": ["SizeX", "SizeY", "SizeZ"],
            "Weapons": ["Damage", "MaxRadius", "Min Radius", "MuzzleSalvoDelay", "MuzzleSalvoSize", "MuzzleVelocity", "RateOfFire", "DamageRadius", "FiringRandomnessWhileMoving", "DPS", "TurretYawSpeed", "FiringTolerance"]
        };

        const FACTIONS = ["UEF", "Aeon", "Cybran", "Seraphim"];
        const CHANGE_TYPES = ["Buff", "Nerf", "Neutral"];

        let unitCount = 0;

        // Elements
        const unitsContainer = document.getElementById('unitsContainer');
        const addUnitBtn = document.getElementById('addUnitBtn');
        const yamlOutput = document.getElementById('yamlData');
        const patchDateInput = document.getElementById('patchDate');
        const copyYamlBtn = document.getElementById('copyYamlBtn');

        // Events
        addUnitBtn.addEventListener('click', createUnitCard);
        document.getElementById('patchForm').addEventListener('input', generateYAML); // Live update YAML

        // Copy to Clipboard Logic
        copyYamlBtn.addEventListener('click', () => {
            if (!yamlOutput.value) return;
            
            yamlOutput.select();
            document.execCommand('copy');
            
            // Visual feedback
            const originalHTML = copyYamlBtn.innerHTML;
            copyYamlBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            copyYamlBtn.classList.add('copied');
            
            setTimeout(() => {
                copyYamlBtn.innerHTML = originalHTML;
                copyYamlBtn.classList.remove('copied');
            }, 2000);
        });

        function createUnitCard() {
            unitCount++;
            const unitId = `unit-${unitCount}`;
            
            const card = document.createElement('div');
            card.className = 'UnitCard';
            card.id = unitId;

            let factionOptions = FACTIONS.map(f => `<option value="${f}">${f}</option>`).join('');
            let typeOptions = CHANGE_TYPES.map(t => `<option value="${t.toLowerCase()}">${t}</option>`).join('');

            card.innerHTML = `
                <div class="UnitCardHeader">
                    <h3>New Unit</h3>
                    <button type="button" class="RemoveBtn" onclick="removeElement('${unitId}')"><i class="fas fa-trash"></i> Remove</button>
                </div>
                
                <div class="Grid2Col">
                    <div class="FormGroup">
                        <label>Unit Code</label>
                        <input type="text" class="u-code" placeholder="e.g. UEL0201" required>
                    </div>
                    <div class="FormGroup">
                        <label>Unit Name</label>
                        <input type="text" class="u-name" placeholder="e.g. Striker" required>
                    </div>
                </div>

                <div class="Grid2Col">
                    <div class="FormGroup">
                        <label>Faction</label>
                        <select class="u-faction">${factionOptions}</select>
                    </div>
                    <div class="FormGroup">
                        <label>Overall Change Type</label>
                        <select class="u-type">${typeOptions}</select>
                    </div>
                </div>

                <div class="FormGroup">
                    <label>Change Description</label>
                    <textarea class="u-desc" placeholder="Explain why these changes were made..." rows="2" required></textarea>
                </div>

                <div class="ChangesWrapper">
                    <div class="ChangesHeader">Stat Changes</div>
                    <div class="ChangesContainer" id="changes-${unitId}"></div>
                    <button type="button" class="ActionBtn" onclick="createChangeRow('${unitId}')" style="margin-top: 0.5rem; padding: 0.5rem;">
                        <i class="fas fa-plus"></i> Add Stat Change
                    </button>
                </div>
            `;

            unitsContainer.appendChild(card);
            
            // Auto-add the first change row to save clicks
            createChangeRow(unitId);
            generateYAML();
        }

        function createChangeRow(unitId) {
            const container = document.getElementById(`changes-${unitId}`);
            const rowId = `change-${Math.random().toString(36).substr(2, 9)}`;
            
            const row = document.createElement('div');
            row.className = 'ChangeRow';
            row.id = rowId;

            let catOptions = Object.keys(CATEGORIES).map(c => `<option value="${c}">${c}</option>`).join('');
            let typeOptions = CHANGE_TYPES.map(t => `<option value="${t.toLowerCase()}">${t}</option>`).join('');

            row.innerHTML = `
                <select class="c-cat" onchange="updateLabels('${rowId}')">${catOptions}</select>
                <select class="c-label"></select>
                <input type="text" class="c-old" placeholder="Old Val" required>
                <input type="text" class="c-new" placeholder="New Val" required>
                <select class="c-type" title="Stat Change Type">${typeOptions}</select>
                <button type="button" class="RemoveBtn" onclick="removeElement('${rowId}')" title="Remove Stat"><i class="fas fa-times"></i></button>
            `;

            container.appendChild(row);
            
            // Trigger label population for the first category
            updateLabels(rowId);
            generateYAML();
        }

        function updateLabels(rowId) {
            const row = document.getElementById(rowId);
            const catSelect = row.querySelector('.c-cat');
            const labelSelect = row.querySelector('.c-label');
            
            const selectedCat = catSelect.value;
            const labels = CATEGORIES[selectedCat] || [];
            
            labelSelect.innerHTML = labels.map(l => `<option value="${l}">${l}</option>`).join('');
            generateYAML();
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
            generateYAML();
        }

        function generateYAML() {
            let yamlString = "";
            const unitCards = document.querySelectorAll('.UnitCard');

            unitCards.forEach(card => {
                const code = card.querySelector('.u-code').value.trim() || "UNKNOWN";
                const type = card.querySelector('.u-type').value;
                const name = card.querySelector('.u-name').value.trim() || "Unknown Unit";
                const faction = card.querySelector('.u-faction').value;
                
                // Safely handle descriptions with quotes/colons by quoting the string in YAML
                let desc = card.querySelector('.u-desc').value.trim().replace(/"/g, '\\"');
                
                yamlString += `- unit_code: ${code}\n`;
                yamlString += `  change_type: ${type}\n`;
                yamlString += `  unit_name: ${name}\n`;
                yamlString += `  faction: ${faction}\n`;
                yamlString += `  description: "${desc}"\n`;
                yamlString += `  changes:\n`;

                const changeRows = card.querySelectorAll('.ChangeRow');
                changeRows.forEach(row => {
                    const cat = row.querySelector('.c-cat').value;
                    const label = row.querySelector('.c-label').value;
                    const oldVal = row.querySelector('.c-old').value.trim() || "-";
                    const newVal = row.querySelector('.c-new').value.trim() || "-";
                    const statType = row.querySelector('.c-type').value;

                    yamlString += `    - category: ${cat}\n`;
                    yamlString += `      label: ${label}\n`;
                    yamlString += `      old: ${oldVal}\n`;
                    yamlString += `      new: ${newVal}\n`;
                    yamlString += `      change_type: ${statType}\n`;
                });
            });

            yamlOutput.value = yamlString;
        }

        // Initialize with one empty unit to start, and set date to today
        document.addEventListener('DOMContentLoaded', () => {
            patchDateInput.valueAsDate = new Date();
            createUnitCard();
        });

        // Submission Logic
        document.getElementById('patchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const version = document.getElementById('patchVersion').value.trim();
            const date = patchDateInput.value;
            const summary = document.getElementById('patchSummary').value.trim();
            const yaml = yamlOutput.value.trim();
            
            if(!yaml) {
                alert("Please add at least one unit change!");
                return;
            }

            const repoOwner = "MrRowey";
            const repoName = "patchnotes";
            
            const params = new URLSearchParams({
                template: 'patch_submission.yml',
                title: `[Patch] Balance Changes: v${version}`,
                patch_version: version,
                patch_date: date,           // Passes the selected date mapping
                patch_summary: summary,
                unit_changes: yaml
            });
            
            const githubUrl = `https://github.com/${repoOwner}/${repoName}/issues/new?${params.toString()}`;
            window.open(githubUrl, '_blank');
        });
    </script>
</body>
</html>
