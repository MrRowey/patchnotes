name: Patch Submission
description: Submit balance changes for the next patch to auto-generate the site
title: "[Patch] Balance Changes: "
labels: ["patch-submission"]
body:
  - type: input
    id: patch_version
    attributes:
      label: Patch Version
      description: Version number for this patch (e.g., 3835)
    validations:
      required: true
      
  - type: input
    id: patch_date
    attributes:
      label: Patch Date
      description: Date this patch went live (YYYY-MM-DD)
    validations:
      required: true
      
  - type: textarea
    id: patch_summary
    attributes:
      label: Patch Summary
      description: Short description of the overall patch goals
    validations:
      required: true
      
  - type: textarea
    id: unit_changes
    attributes:
      label: Unit Changes
      description: Paste the unit changes in strict YAML format
    validations:
      required: true