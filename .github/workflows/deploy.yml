name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Some upstream GitHub Actions dependencies still emit DEP0040 under Node 24.
  NODE_OPTIONS: --disable-warning=DEP0040

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Build static site
      run: |
        # Copy all files to _site directory
        mkdir -p _site
        cp -r * _site/ 2>/dev/null || true
        # Remove workflow files from _site
        rm -rf _site/.github
        # Ensure proper permissions
        find _site -type f -name "*.html" -exec chmod 644 {} \;
        find _site -type f -name "*.css" -exec chmod 644 {} \;
        find _site -type f -name "*.js" -exec chmod 644 {} \;

    - name: Package Pages artifact
      run: |
        # Create a Pages-compatible artifact: one gzip containing one tar file.
        tar \
          --dereference --hard-dereference \
          --directory "_site" \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          --exclude=".[^/]*" \
          .
        gzip -9 "$RUNNER_TEMP/artifact.tar"

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: github-pages
        path: ${{ runner.temp }}/artifact.tar.gz
        retention-days: 1
        if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
